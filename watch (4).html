<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarjeta Roja · En Vivo</title>
  <link rel="icon" type="image/png" href="https://tarjetaroja.bio/wp-content/uploads/2026/08/cropped-favicon-192x192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<script data-cfasync="false" src="https://capitalhospitals.org/1/cd2ede3915aed8ac32648df7385b788a"></script>
  <style>
    /* ===== BASE CSS ===== */
    :root {
      --bg-main: #07090c;
      --bg-surface: #0e1219;
      --bg-card: #121620;
      --roja-red: #d20000;
      --roja-red-bright: #ef1e2b;
      --roja-gold: #ffae00;
      --roja-gold-bright: #ffd166;
      --live-green: #10b981;
      --text-white: #ffffff;
      --text-primary: #f3f4f6;
      --text-secondary: #9ca3af;
      --border-card: #1f2737;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-full: 9999px;
      --font-heading: 'Outfit', sans-serif;
      --font-body: 'Inter', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      background-color: var(--bg-main);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-image: radial-gradient(circle at 50% 0%, rgba(210, 0, 0, 0.12) 0%, transparent 45%), linear-gradient(to bottom, #07090c 0%, #090c12 100%);
      background-attachment: fixed;
    }
    a { color: inherit; text-decoration: none; transition: all 0.2s ease; }
    button { font-family: inherit; border: none; background: none; cursor: pointer; }
    .container { width: 100%; max-width: 1300px; margin: 0 auto; padding: 0 16px; }

    /* ===== HEADER ===== */
    .site-header {
      background: linear-gradient(180deg, #df0000 0%, #aa0000 100%);
      border-bottom: 2px solid #ffffff;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
      position: sticky; top: 0; z-index: 1000; width: 100%;
    }
    .header-fluid-inner {
      width: 100%; margin: 0; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; min-height: 48px;
    }
    .site-brand { display: inline-flex; align-items: center; gap: 10px; }
    .site-brand-logo {
      width: 32px; height: 32px; border-radius: 50%; border: 2px solid #fff; object-fit: cover;
    }
    .site-brand-text {
      font-family: var(--font-heading); font-size: 1.7rem; font-weight: 800; color: #ffff55;
      letter-spacing: -0.4px; line-height: 1; text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.7); white-space: nowrap;
    }
    .btn-back-agenda {
      display: inline-flex; align-items: center; gap: 6px; background: rgba(0, 0, 0, 0.3); color: #fff;
      padding: 6px 14px; border-radius: var(--radius-sm); font-size: 0.85rem; font-weight: 700;
      border: 1px solid rgba(255, 255, 255, 0.2); transition: all 0.2s;
    }
    .btn-back-agenda:hover { background: rgba(0, 0, 0, 0.5); color: var(--roja-gold-bright); }

    /* ===== BANNERS ===== */
    .banner-728-wrap { display: flex; justify-content: center; align-items: center; margin: 16px 0; min-height: 90px; overflow: hidden; }
    .banner-side {
      flex: 0 0 160px; width: 160px; position: sticky; top: 70px; align-self: flex-start;
      display: flex; justify-content: center; align-items: flex-start;
    }
    
    .page-layout {
      display: flex; justify-content: center; align-items: flex-start; gap: 24px;
      max-width: 1440px; margin: 0 auto; padding: 0 16px; position: relative;
    }
    .main-column { flex: 1 1 auto; max-width: 1040px; min-width: 0; }

    /* ===== STREAM BANNER ===== */
    .stream-match-banner {
      background: #10141d; border: 1px solid var(--border-card); border-radius: var(--radius-md);
      padding: 20px; margin: 0 0 18px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5); text-align: center;
    }
    .match-meta-tags { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
    .pill-live-glow {
      background: var(--roja-red); color: #fff; font-size: 0.75rem; font-weight: 800;
      padding: 3px 10px; border-radius: var(--radius-full); display: inline-flex; align-items: center; gap: 6px;
      box-shadow: 0 0 10px rgba(210, 0, 0, 0.6);
    }
    .pill-league-tag {
      background: #171d29; border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--roja-gold-bright); font-size: 0.78rem; font-weight: 700;
      padding: 3px 10px; border-radius: var(--radius-full);
    }
    .stream-match-teams-box { display: flex; align-items: center; justify-content: center; gap: 24px; }
    .stream-team-title { font-family: var(--font-heading); font-size: 1.45rem; font-weight: 800; color: #ffffff; }
    .stream-vs-circle {
      width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #d20000 0%, #aa0000 100%);
      color: var(--roja-gold-bright); display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 0.85rem; border: 2px solid #fff;
    }

    /* ===== PLAYER ===== */
    .stream-grid-layout { display: grid; grid-template-columns: 1fr 340px; gap: 20px; margin-bottom: 30px; }
    .player-box-column { display: flex; flex-direction: column; gap: 14px; }
    .player-viewport-wrap {
      position: relative; width: 100%; padding-top: 56.25%; background: #000000;
      border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--border-card);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
    }
    .player-viewport-wrap iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
    .player-controls-tray {
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
      background: #11151e; border: 1px solid var(--border-card); padding: 10px 14px; border-radius: var(--radius-sm);
    }
    .btn-player-aux {
      background: #171d29; color: #e2e8f0; border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px 12px; border-radius: var(--radius-sm); font-size: 0.8rem; font-weight: 600;
      display: inline-flex; align-items: center; gap: 5px; cursor: pointer; transition: all 0.2s;
    }
    .btn-player-aux:hover { background: #202738; color: var(--roja-gold-bright); }

    /* ===== CHAT ===== */
    .stream-chat-box {
      background: #10141d; border: 1px solid var(--border-card); border-radius: var(--radius-md);
      display: flex; flex-direction: column; height: 580px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); overflow: hidden;
    }
    .chat-box-header { background: #151a24; border-bottom: 1px solid var(--border-card); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; }
    .chat-title-wrap { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; font-weight: 700; color: #fff; }
    .chat-messages-scroll { flex: 1; padding: 12px 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .chat-msg-row { display: flex; flex-direction: column; gap: 2px; font-size: 0.82rem; background: #141822; padding: 6px 10px; border-radius: var(--radius-sm); border-left: 2px solid var(--roja-red); }
    .chat-user-title { font-weight: 700; color: var(--roja-gold); }
    .chat-msg-text { color: #e5e7eb; }
    .chat-input-bar { padding: 10px 12px; background: #141822; border-top: 1px solid var(--border-card); display: flex; gap: 8px; }
    .chat-text-input { flex: 1; background: #1a202d; border: 1px solid #283245; color: #fff; padding: 8px 12px; border-radius: var(--radius-sm); font-size: 0.82rem; }
    .chat-text-input:focus { outline: none; border-color: var(--roja-red); }
    .btn-send-chat { background: var(--roja-red); color: #fff; padding: 8px 14px; border-radius: var(--radius-sm); font-size: 0.8rem; font-weight: 700; cursor: pointer; }
    .btn-send-chat:hover { background: var(--roja-red-bright); }

    /* Responsive */
    @media screen and (max-width: 1320px) {
      .banner-side { display: none; }
    }
    @media screen and (max-width: 900px) {
      .stream-grid-layout { grid-template-columns: 1fr; }
      .stream-chat-box { height: 420px; }
      .header-fluid-inner { padding: 0 14px; }
    }
    @media screen and (max-width: 600px) {
      .stream-match-teams-box { flex-direction: column; gap: 8px; }
      .stream-team-title { font-size: 1.2rem; text-align: center; }
      .player-controls-tray { flex-direction: column; align-items: stretch; }
      .btn-player-aux { justify-content: center; }
      .btn-back-agenda span { display: none; }
    }
  </style>
</head>
<body>

  <!-- SCRIPT TO LOAD MATCH DATA FROM URL -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Get URL parameters
      const urlParams = new URLSearchParams(window.location.search);
      
      const streamUrl = urlParams.get('url');
      const team1 = urlParams.get('team1');
      const team2 = urlParams.get('team2');
      const league = urlParams.get('league');

      // Update UI
      if (league) document.getElementById('leagueTag').textContent = league;
      if (team1) document.getElementById('team1Title').textContent = team1;
      if (team2) document.getElementById('team2Title').textContent = team2;

      const player = document.getElementById('videoPlayer');
      const openNewTabBtn = document.getElementById('openNewTabBtn');

      // Set Player Source
      if (streamUrl && streamUrl !== 'undefined') {
        // Decode URI just in case it contains special characters
        const decodedUrl = decodeURIComponent(streamUrl);
        player.src = decodedUrl;
        
        // Open in new tab functionality
        openNewTabBtn.onclick = () => {
          window.open(decodedUrl, '_blank');
        };
      } else {
        player.src = 'https://flyembed.cfd/embed/1.php'; // fallback
      }

      // --- Simple Chat Logic ---
      const chatInput = document.getElementById('chatInput');
      const sendChatBtn = document.getElementById('sendChatBtn');
      const chatMessages = document.getElementById('chatMessages');

      function sendMessage() {
        const text = chatInput.value.trim();
        if (!text) return;
        
        // Add message
        const msgHTML = `
          <div class="chat-msg-row" style="border-left-color: var(--live-green);">
            <span class="chat-user-title">👤 Tú</span>
            <span class="chat-msg-text">${text}</span>
          </div>
        `;
        chatMessages.insertAdjacentHTML('beforeend', msgHTML);
        chatInput.value = '';
        
        // Scroll to bottom
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }

      sendChatBtn.addEventListener('click', sendMessage);
      chatInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
      });
    });

    function reloadPlayer() {
      const player = document.getElementById('videoPlayer');
      const currentSrc = player.src;
      player.src = currentSrc;
    }
  </script>
